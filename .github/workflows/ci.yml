# Sindris — 持续集成（测试门禁）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Ruff (fatal syntax / __all__ consistency)
        run: ruff check scripts modules validators contracts sindris_executor.py tests

      - name: Bandit (High severity only; use plain bandit locally for full report)
        run: bandit -r scripts modules validators contracts -lll

  test:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ci_dummy_key
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-anyio coverage pytest-xdist

      - name: Prepare legacy compatibility paths
        run: |
          sudo mkdir -p /home/rayliu/.openclaw/skills
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/rayliu/.openclaw/skills/sindris

      - name: Release contract
        run: python -m pytest tests/test_release_contract.py -q --tb=short

      - name: Full test suite (parallel)
        run: |
          export DEEPSEEK_API_KEY="${DEEPSEEK_API_KEY:-ci_dummy_key}"
          python -m pytest tests/ -n auto -q --tb=short
