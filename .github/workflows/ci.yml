# Sindris — 持续集成（测试门禁）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-anyio

      - name: Prepare legacy compatibility paths
        run: |
          mkdir -p /home/rayliu/.openclaw/skills
          ln -sfn "$GITHUB_WORKSPACE" /home/rayliu/.openclaw/skills/sindris

      - name: Release contract
        run: python -m pytest tests/test_release_contract.py -q --tb=short

      - name: Full test suite
        run: python -m pytest tests/ -q --tb=short
